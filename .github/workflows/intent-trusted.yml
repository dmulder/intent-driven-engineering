name: Trusted intent validation
# This workflow runs base-branch code ONLY, except for explicit engine/schema evolution.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  trusted-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preserve trusted validator
        run: |
          test -f tools/intentctl.py
          mkdir -p "$RUNNER_TEMP/trusted-intent"
          cp -R tools/. "$RUNNER_TEMP/trusted-intent/"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate proposed history with trusted engine
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', base, head], text=True
          ).splitlines()
          engine_evolution = any(
              path == 'tools/intentctl.py'
              or path.startswith('tools/intentlib/')
              or path.startswith('.intent/schema/')
              for path in changed
          )
          if engine_evolution:
              # Base engines cannot accept successor schemas or unknown fields.
              # Self-check the proposed range with the proposed engine and require human review.
              print('Engine/schema evolution detected; using proposed validator for this range.')
              print('Trusted base-engine enforcement does not apply to its own successor.')
              cmd = ['python3', 'tools/intentctl.py', 'validate', '--range', f'{base}..{head}', '--json']
          else:
              cmd = ['python3', f"{os.environ['RUNNER_TEMP']}/trusted-intent/intentctl.py",
                     'validate', '--range', f'{base}..{head}', '--json']
          subprocess.run(cmd, check=True)
          PY

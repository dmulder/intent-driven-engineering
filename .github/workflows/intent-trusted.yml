name: Trusted intent validation
# This workflow runs base-branch code ONLY. Never run proposed tests here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  trusted-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preserve trusted validator
        run: |
          test -f tools/intentctl.py
          mkdir -p "$RUNNER_TEMP/trusted-intent"
          cp -R tools/. "$RUNNER_TEMP/trusted-intent/"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate proposed history with trusted engine
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 "$RUNNER_TEMP/trusted-intent/intentctl.py" validate --range "$BASE_SHA..$HEAD_SHA" --json
